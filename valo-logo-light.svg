<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80">
  <defs>
    <clipPath id="mark-light">
      <rect x="0" y="8" width="64" height="64" rx="8"/>
    </clipPath>
  </defs>

  <!-- Mark -->
  <g clip-path="url(#mark-light)">
    <rect x="0" y="8" width="64" height="64" fill="#1B3A52"/>
    <rect x="0" y="8" width="32" height="32" fill="#E8621A"/>
    <rect x="32" y="40" width="32" height="32" fill="#E8621A"/>
    <circle cx="32" cy="40" r="30" fill="#1B3A52"/>
    <line x1="32" y1="8" x2="32" y2="72" stroke="white" stroke-width="2.5" opacity="0.9"/>
    <line x1="0" y1="40" x2="64" y2="40" stroke="white" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- VALO wordmark -->
  <text x="80" y="52"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-weight="900"
    font-size="38"
    letter-spacing="-0.5"
    fill="#1B3A52">VALO</text>

  <!-- TECHNOLOGIES LLC -->
  <text x="81" y="68"
    font-family="Arial, sans-serif"
    font-weight="700"
    font-size="11"
    letter-spacing="3.5"
    fill="#8a9aaa">TECHNOLOGIES LLC</text>

</svg>
